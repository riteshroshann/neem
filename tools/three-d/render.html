<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Ritesh Roshan" />
    <title>Neem yard film</title>
    <!-- One school's heat twin in 3D: the 12 s loop of the planting, or, when window.KV carries
         future stages, the same planting from seed to thirty years. tools/three-d/render.py
         injects window.KV and draws one frame per call, renderAt(t) or drawFuture(state);
         nothing here runs on a clock. -->
    <style>
      html,
      body {
        margin: 0;
        background: #13100d;
        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "../../web/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";

      // The scene is Twin3D's: one vertex per 1 m cell, roofs from dsm, crowns from cdsm,
      // flat shaded. The ground takes the published 1 pm maps instead of the live surrogate.
      const NIGHT = "#13100d";
      const PAPER = "#faf7f1";
      const ROOF = [214, 214, 214];
      const CROWN = [62, 112, 70];
      const EDGE = "#3b332c"; // the cut edge of the tile
      const ZONE_GROUND = 1;
      const ZONE_BUILDING = 2;
      const TALL_M = 2.5; // palette.map.tall_m: anything taller is a roof
      const NEEM = { height: 7.0, radius: 3.5 }; // physics.ts SPECIES.neem
      const SKIRT_M = 4; // how far the tile's edge drops below its lowest ground
      const GREEN_M = 1; // a sprouting crown is fully green once it is this tall

      // Timeline in seconds. 9.5 s to 12 s plays the growth backwards, so the loop closes.
      const LOOP = 12;
      const GROW_FROM = 3;
      const GROW_TO = 6;
      const HOLD_TO = 9.5;
      const TREE_S = 1.2;

      // One turn round the yard at a fixed elevation, framed to the widest point of the turn.
      const FOV = 30;
      const ELEVATION = 40;
      const PHI0 = 15; // compass bearing from the yard to the camera at t = 0
      const MARGIN = 0.07;

      // Key from the 1 pm sun, a cool fill from the opposite sky, and a soft dome. The shares
      // are of the light on open ground, which is scaled to show its map colour at EXPOSURE.
      const KEY = { colour: "#fff3e4", share: 0.62 };
      const FILL = { colour: "#cdd9f2", share: 0.12, altitude: 30 };
      const DOME = { sky: "#e9effc", ground: "#5c5146", share: 0.26 };
      const EXPOSURE = 0.95;

      // The future: the same planting at each modelled age. render.py hands over each frame's
      // tree size, ground and camera; the page only draws them. New trees stand apart from the
      // tile as crowns on trunks, so the ground under them keeps its SOLWEIG colour.
      const TRUNK = 0.25; // shadow.TRUNK_RATIO: SOLWEIG lets light under this share of a tree
      // neem greens, from under the rim to the top of a crown
      const GREENS = ["#1d4530", "#2c6142", "#3f7d4f", "#68a05c", "#9cc57e"];
      const BOUNCE = 0.45; // sunlit ground lighting leaves from below, as a share of GREENS[0]
      const BARK = "#4a3c31";
      const BOLE = 0.0052; // trunk radius per height^1.5: 3 cm across at 2 m, 60 cm at 15 m
      const SINK = 0.3; // trunks start below their cell, so none floats where the tile slopes
      const SHAPES = 3; // crown shapes, handed round the trees
      const MASS_M = 3; // today's canopy is shaded against its tallest point within this reach
      const SOFTEN = 1; // binomial passes over today's canopy heights
      const STILL = { elevation: 40, bearing: 155, margin: 0.06 };
      const RIDE = {
        from: { elevation: 55, bearing: 125, margin: 0.06, room: 1.2 },
        to: { elevation: 25, bearing: 165, margin: 0.03, room: 0.9 },
      };

      const KV = window.KV;
      const { width, height, scale } = KV.frame;
      const { rows, cols, pixel_size: px, x0, y0 } = KV.summary.grid;
      const n = rows * cols;

      const linear = (v) => {
        const c = v / 255;
        return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      };
      const LIN = Float32Array.from({ length: 256 }, (_, v) => linear(v));
      const lin3 = (rgb) => rgb.map((v) => LIN[v]);
      const hex3 = (hex) => lin3([1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16)));
      const smoother = (u) => {
        const x = Math.min(1, Math.max(0, u));
        return x * x * x * (x * (6 * x - 15) + 10);
      };
      const rad = THREE.MathUtils.degToRad;

      /** The twin's raster layers, laid out as in web/src/lib/twin.ts. */
      async function readLayers(b64) {
        const gz = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
        const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
        const buf = await new Response(stream).arrayBuffer();
        const read = (name) => {
          const l = KV.summary.layers.find((x) => x.name === name);
          return Float32Array.from(new Int16Array(buf, l.offset, n), (v) => v / l.scale);
        };
        const zones = Uint8Array.from(read("zones"), (v) => Math.round(v));
        return { dsm: read("dsm"), dem: read("dem"), cdsm: read("cdsm"), zones };
      }

      /** A 1 pm map composited over paper, the way the site shows it, as linear rgb per cell. */
      async function overPaper(src) {
        const img = new Image();
        img.src = src;
        await img.decode();
        if (img.width !== cols || img.height !== rows) {
          throw new Error(`map is ${img.width}x${img.height}, the grid ${cols}x${rows}`);
        }
        const canvas = Object.assign(document.createElement("canvas"), {
          width: cols,
          height: rows,
        });
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = PAPER;
        ctx.fillRect(0, 0, cols, rows);
        ctx.drawImage(img, 0, 0);
        const rgba = ctx.getImageData(0, 0, cols, rows).data;
        const out = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          for (let k = 0; k < 3; k++) out[i * 3 + k] = LIN[rgba[i * 4 + k]];
        }
        return out;
      }

      // World axes: x east, y up, z south, origin at the grid centre; vertex (r, c) sits on the
      // centre of cell (r, c).
      const worldX = (e) => e - (x0 + (cols * px) / 2);
      const worldZ = (north) => y0 - (rows * px) / 2 - north;

      /** Cells each tree can reach at full size, as physics.applyDesign walks them. */
      function reach(tree, zones) {
        const R = NEEM.radius;
        const cMin = Math.max(0, Math.floor((tree.x - R - x0) / px) - 1);
        const cMax = Math.min(cols - 1, Math.ceil((tree.x + R - x0) / px) + 1);
        const rMin = Math.max(0, Math.floor((y0 - tree.y - R) / px) - 1);
        const rMax = Math.min(rows - 1, Math.ceil((y0 - tree.y + R) / px) + 1);
        const cells = [];
        const d2 = [];
        for (let r = rMin; r <= rMax; r++) {
          const y = y0 - (r + 0.5) * px;
          for (let c = cMin; c <= cMax; c++) {
            const i = r * cols + c;
            if (zones[i] === ZONE_BUILDING) continue;
            const x = x0 + (c + 0.5) * px;
            const dd = (x - tree.x) ** 2 + (y - tree.y) ** 2;
            if (dd <= R * R) {
              cells.push(i);
              d2.push(dd);
            }
          }
        }
        return { cells: Int32Array.from(cells), d2: Float32Array.from(d2) };
      }

      /** Where the growth stands at time t, as a time inside the forward growth. */
      function growthClock(t) {
        if (t <= GROW_TO) return t;
        if (t <= HOLD_TO) return GROW_TO;
        return GROW_TO - ((t - HOLD_TO) * (GROW_TO - GROW_FROM)) / (LOOP - HOLD_TO);
      }

      function compass(altitude, azimuth) {
        const a = rad(altitude);
        const z = rad(azimuth);
        return new THREE.Vector3(
          Math.sin(z) * Math.cos(a),
          Math.sin(a),
          -Math.cos(z) * Math.cos(a),
        );
      }

      function addLights(scene) {
        const lum = (c) => 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
        const ground = Math.PI * EXPOSURE; // irradiance that shows an albedo as itself
        const key = new THREE.DirectionalLight(KEY.colour, 1);
        key.position.copy(compass(KV.sun.altitude, KV.sun.azimuth));
        key.intensity = (KEY.share * ground) / (lum(key.color) * key.position.y);
        const fill = new THREE.DirectionalLight(FILL.colour, 1);
        fill.position.copy(compass(FILL.altitude, KV.sun.azimuth + 180));
        fill.intensity = (FILL.share * ground) / (lum(fill.color) * fill.position.y);
        const dome = new THREE.HemisphereLight(DOME.sky, DOME.ground, 1);
        dome.intensity = (DOME.share * ground) / lum(dome.color);
        scene.add(key, fill, dome);
      }

      /** Side walls round the tile, from its edge heights down below the lowest ground. */
      function skirt(pos, bottom) {
        const ring = [];
        for (let c = 0; c < cols; c++) ring.push(c);
        for (let r = 1; r < rows; r++) ring.push(r * cols + cols - 1);
        for (let c = cols - 2; c >= 0; c--) ring.push((rows - 1) * cols + c);
        for (let r = rows - 2; r >= 0; r--) ring.push(r * cols);
        const out = [];
        for (let k = 0; k + 1 < ring.length; k++) {
          const [a, b] = [ring[k] * 3, ring[k + 1] * 3];
          const at = [pos[a], pos[a + 1], pos[a + 2]];
          const bt = [pos[b], pos[b + 1], pos[b + 2]];
          const ab = [at[0], bottom, at[2]];
          const bb = [bt[0], bottom, bt[2]];
          out.push(...at, ...bb, ...ab, ...at, ...bt, ...bb);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(out, 3));
        geometry.computeVertexNormals();
        return new THREE.Mesh(
          geometry,
          new THREE.MeshLambertMaterial({ color: EDGE, flatShading: true }),
        );
      }

      function aim(camera, elevation, phi, distance, target) {
        const p = compass(elevation, phi).multiplyScalar(distance);
        camera.position.copy(target).add(p);
        camera.lookAt(target);
        camera.updateMatrixWorld();
      }

      const place = (camera, phi, distance, target) =>
        aim(camera, ELEVATION, phi, distance, target);

      /** The orbit radius that keeps every point in frame all the way round, and the vertical
       * shift that centres them. */
      function fit(points, target) {
        const camera = new THREE.PerspectiveCamera(FOV, width / height, 1, 10000);
        const v = new THREE.Vector3();
        const extent = (distance) => {
          let x = 0;
          let lo = Number.POSITIVE_INFINITY;
          let hi = Number.NEGATIVE_INFINITY;
          for (let phi = 0; phi < 360; phi += 3) {
            place(camera, phi, distance, target);
            for (let k = 0; k < points.length; k += 3) {
              v.set(points[k], points[k + 1], points[k + 2]).project(camera);
              x = Math.max(x, Math.abs(v.x));
              lo = Math.min(lo, v.y);
              hi = Math.max(hi, v.y);
            }
          }
          return { x, lo, hi };
        };
        let near = 50;
        let far = 5000;
        for (let it = 0; it < 24; it++) {
          const mid = (near + far) / 2;
          const e = extent(mid);
          if (e.x <= 1 - MARGIN && (e.hi - e.lo) / 2 <= 1 - MARGIN) far = mid;
          else near = mid;
        }
        const e = extent(far);
        return { distance: far, shift: (e.hi + e.lo) / 2 };
      }

      /** The tile as Twin3D lays it out, one vertex per cell; callers fill heights and colours. */
      async function terrain() {
        const layers = await readLayers(KV.layers);
        const { dsm, dem, zones } = layers;
        let base = Number.POSITIVE_INFINITY;
        for (let i = 0; i < n; i++) base = Math.min(base, dem[i]);
        const roof = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
          roof[i] = zones[i] === ZONE_BUILDING || dsm[i] - dem[i] > TALL_M ? 1 : 0;
        }

        const geometry = new THREE.PlaneGeometry(
          (cols - 1) * px,
          (rows - 1) * px,
          cols - 1,
          rows - 1,
        );
        geometry.rotateX(-Math.PI / 2);
        geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        const mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
        );
        mesh.frustumCulled = false;
        const pos = geometry.getAttribute("position");
        const col = geometry.getAttribute("color");
        return { ...layers, base, roof, mesh, pos, col };
      }

      /** The yard's centre, which the camera turns round and the planting ripples out from. */
      function yardCentre(zones, dem, base) {
        let yr = 0;
        let yc = 0;
        let yn = 0;
        let yh = 0;
        for (let i = 0; i < n; i++) {
          if (zones[i] !== ZONE_GROUND) continue;
          yr += Math.floor(i / cols);
          yc += i % cols;
          yh += dem[i] - base;
          yn++;
        }
        return new THREE.Vector3(
          (yc / yn - (cols - 1) / 2) * px,
          yh / yn,
          (yr / yn - (rows - 1) / 2) * px,
        );
      }

      function makeRenderer() {
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(scale);
        renderer.setSize(width, height);
        renderer.setClearColor(NIGHT);
        document.body.appendChild(renderer.domElement);
        return renderer;
      }

      function glName(renderer) {
        const gl = renderer.getContext();
        const info = gl.getExtension("WEBGL_debug_renderer_info");
        return gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
      }

      async function build() {
        const { dsm, dem, cdsm, zones, base, roof, mesh, pos, col } = await terrain();
        const today = await overPaper(KV.maps.today);
        const plan = await overPaper(KV.maps.plan);
        const target = yardCentre(zones, dem, base);

        const trees = KV.trees.map((t) => ({ ...reach(t, zones), x: worldX(t.x), z: worldZ(t.y) }));
        const dist = trees.map((t) => Math.hypot(t.x - target.x, t.z - target.z));
        const dMin = Math.min(...dist);
        const dMax = Math.max(...dist);
        trees.forEach((t, k) => {
          const u = dMax > dMin ? (dist[k] - dMin) / (dMax - dMin) : 0;
          t.start = GROW_FROM + u * (GROW_TO - GROW_FROM - TREE_S);
        });

        // Each cell takes the plan's colour as its nearest new tree grows, so shade arrives with
        // the crown that casts it rather than ahead of it.
        const nearest = new Uint16Array(n);
        for (let i = 0; i < n; i++) {
          const x = ((i % cols) - (cols - 1) / 2) * px;
          const z = (Math.floor(i / cols) - (rows - 1) / 2) * px;
          let best = Number.POSITIVE_INFINITY;
          for (let k = 0; k < trees.length; k++) {
            const d = (x - trees[k].x) ** 2 + (z - trees[k].z) ** 2;
            if (d < best) {
              best = d;
              nearest[i] = k;
            }
          }
        }

        const planted = new Float32Array(n);
        const crown = lin3(CROWN);
        const grey = lin3(ROOF);

        /** Heights and colours at time t: Twin3D's paint with the trees part-grown. */
        function paint(t) {
          const clock = growthClock(t);
          const grown = trees.map((tree) => smoother((clock - tree.start) / TREE_S));
          planted.fill(0);
          for (let j = 0; j < trees.length; j++) {
            const tree = trees[j];
            const s = grown[j];
            if (s <= 0) continue;
            const r2 = (NEEM.radius * s) ** 2;
            const h = NEEM.height * s;
            for (let k = 0; k < tree.cells.length; k++) {
              const dd = tree.d2[k];
              if (dd > r2) continue;
              const v = h * (1 - dd / r2) ** 0.25;
              const i = tree.cells[k];
              if (v > planted[i]) planted[i] = v;
            }
          }
          const p = pos.array;
          const c = col.array;
          for (let i = 0; i < n; i++) {
            const ground = dem[i] - base;
            const canopy = Math.max(cdsm[i], planted[i]);
            p[i * 3 + 1] = Math.max(dsm[i] - base, ground + canopy);
            let rgb;
            if (roof[i]) rgb = grey;
            else if (cdsm[i] > 0) rgb = crown;
            else {
              const f = grown[nearest[i]];
              const w = Math.min(1, planted[i] / GREEN_M);
              rgb = [0, 1, 2].map((k) => {
                const g = today[i * 3 + k] + f * (plan[i * 3 + k] - today[i * 3 + k]);
                return g + w * (crown[k] - g);
              });
            }
            c[i * 3] = rgb[0];
            c[i * 3 + 1] = rgb[1];
            c[i * 3 + 2] = rgb[2];
          }
          pos.needsUpdate = true;
          col.needsUpdate = true;
        }

        paint(0);
        // the rim is the same at every t: new trees stand well inside the school
        const edge = skirt(pos.array, -SKIRT_M);

        // frame the tile's rim, its foot, and everything standing on it
        const points = [];
        for (let i = 0; i < n; i++) {
          const r = Math.floor(i / cols);
          const c = i % cols;
          const y = pos.array[i * 3 + 1];
          const rim = r === 0 || c === 0 || r === rows - 1 || c === cols - 1;
          if (rim || y > TALL_M) points.push(pos.array[i * 3], y, pos.array[i * 3 + 2]);
          if (rim) points.push(pos.array[i * 3], -SKIRT_M, pos.array[i * 3 + 2]);
        }
        const framing = fit(Float32Array.from(points), target);

        const scene = new THREE.Scene();
        scene.add(mesh, edge);
        addLights(scene);

        const camera = new THREE.PerspectiveCamera(FOV, width / height, 10, 10000);
        camera.setViewOffset(width, height, 0, (-framing.shift * height) / 2, width, height);

        const renderer = makeRenderer();

        window.renderAt = (t) => {
          const time = ((t % LOOP) + LOOP) % LOOP;
          paint(time);
          place(camera, PHI0 + (360 * time) / LOOP, framing.distance, target);
          renderer.render(scene, camera);
        };

        return { gl: glName(renderer), distance: framing.distance, trees: trees.length };
      }

      /** Deterministic noise, so every run grows the same crowns. */
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Height, as a share of a crown, at which each of the GREENS is reached. Today's canopy
      // stops short of the fourth, so the new planting reads apart from it.
      const CROWN_STOPS = [0.25, 0.42, 0.62, 0.82, 0.98];
      const CANOPY_STOPS = [0.3, 0.6, 0.85, 1.25];
      const GREENS_LIN = GREENS.map(hex3);

      /** The neem green at height y on a ramp of stops, as linear rgb. */
      function green(y, stops) {
        let g = 0;
        while (g < stops.length - 1 && y > stops[g]) g++;
        if (g === 0) return GREENS_LIN[0];
        const u = smoother((y - stops[g - 1]) / (stops[g] - stops[g - 1]));
        const [a, b] = [GREENS_LIN[g - 1], GREENS_LIN[g]];
        return [0, 1, 2].map((c) => a[c] + u * (b[c] - a[c]));
      }

      /** Points spread over the sphere's upper part, which the camera sees, each with a size. */
      function scatter(rand, count, spread) {
        return Array.from({ length: count }, () => {
          const y = 1 - 1.45 * rand();
          const a = 2 * Math.PI * rand();
          const s = Math.sqrt(1 - y * y);
          return { at: new THREE.Vector3(s * Math.cos(a), y, s * Math.sin(a)), spread };
        });
      }

      /** How fully a direction falls inside any of the bumps, from 0 to 1. */
      function cover(dir, bumps) {
        let miss = 1;
        for (const b of bumps) miss *= 1 - Math.exp((dir.dot(b.at) - 1) / b.spread);
        return 1 - miss;
      }

      /** One neem crown, 1 across its widest and 1 from its base to its top: a full dome over a
       * flatter underside, made of leaf masses and smaller tufts. Greens run from the darkest
       * under the rim to the lightest on top; hollows between the masses are darker still. */
      function crownGeometry(seed) {
        const AROUND = 112;
        const UP = 64;
        const EQUATOR = 0.36; // where the crown is widest, as a share of its depth
        const DOME_P = 2.4; // superellipse exponents: a fuller dome, a rounder underside
        const BELLY_P = 2.0;
        const DENT = 0.13; // how far the hollows between leaf masses sit inside them
        const TUFT = 0.045;
        const rand = mulberry32(seed);
        const masses = scatter(rand, 24, 0.05);
        const tufts = scatter(rand, 150, 0.009);
        const position = [];
        const leaf = [];
        const dir = new THREE.Vector3();
        const vertex = (theta, phi) => {
          const c = -Math.cos(theta);
          const s = Math.sin(theta);
          dir.set(s * Math.cos(phi), c, s * Math.sin(phi));
          const mass = cover(dir, masses);
          const tuft = cover(dir, tufts);
          const p = c < 0 ? BELLY_P : DOME_P;
          const rho = s ** (2 / p);
          const lift = Math.abs(c) ** (2 / p) * (c < 0 ? -EQUATOR : 1 - EQUATOR);
          const m = 1 - DENT * (1 - mass) - TUFT * (1 - tuft);
          position.push(m * rho * Math.cos(phi), EQUATOR + m * lift, m * rho * Math.sin(phi));
          leaf.push((0.68 + 0.32 * mass) * (0.9 + 0.1 * tuft) * (0.95 + 0.1 * rand()));
        };
        vertex(0, 0);
        for (let j = 1; j < UP; j++) {
          for (let i = 0; i < AROUND; i++) vertex((Math.PI * j) / UP, (2 * Math.PI * i) / AROUND);
        }
        vertex(Math.PI, 0);

        const index = [];
        const ring = (j, i) => 1 + (j - 1) * AROUND + (i % AROUND);
        const top = 1 + (UP - 1) * AROUND;
        for (let i = 0; i < AROUND; i++) {
          index.push(0, ring(1, i), ring(1, i + 1));
          for (let j = 1; j < UP - 1; j++) {
            const [a, b, c, d] = [ring(j, i), ring(j, i + 1), ring(j + 1, i), ring(j + 1, i + 1)];
            index.push(a, c, b, b, c, d);
          }
          index.push(ring(UP - 1, i), top, ring(UP - 1, i + 1));
        }

        // exactly 1 across and 1 deep, so the instance scale is the crown's true size
        let r = 0;
        let lo = Number.POSITIVE_INFINITY;
        let hi = Number.NEGATIVE_INFINITY;
        for (let k = 0; k < position.length; k += 3) {
          r = Math.max(r, Math.hypot(position[k], position[k + 2]));
          lo = Math.min(lo, position[k + 1]);
          hi = Math.max(hi, position[k + 1]);
        }
        const colour = [];
        for (let k = 0; k < position.length; k += 3) {
          position[k] /= r;
          position[k + 2] /= r;
          const y = (position[k + 1] - lo) / (hi - lo);
          position[k + 1] = y;
          const g = green(y, CROWN_STOPS);
          for (let c = 0; c < 3; c++) colour.push(leaf[k / 3] * g[c]);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(position, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colour, 3));
        geometry.setIndex(index);
        geometry.computeVertexNormals();
        return geometry;
      }

      /** Canopy heights after passes of a 3 x 3 binomial, kept to the cells that have canopy:
       * edges round off, but no crown spreads past its footprint. */
      function soften(cdsm, roof, passes) {
        let h = Float32Array.from(cdsm, (v, i) => (roof[i] ? 0 : v));
        for (let pass = 0; pass < passes; pass++) {
          const next = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            if (h[i] <= 0) continue;
            const [r, c] = [Math.floor(i / cols), i % cols];
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const [rr, cc] = [r + dr, c + dc];
                if (rr < 0 || cc < 0 || rr >= rows || cc >= cols) continue;
                next[i] += (h[rr * cols + cc] * (2 - Math.abs(dr)) * (2 - Math.abs(dc))) / 16;
              }
            }
          }
          h = next;
        }
        return h;
      }

      /** Today's canopy taken out of the flat tile into a smooth mesh of its own, so it reads as
       * foliage beside the new crowns. It shares the tile's vertices, already raised to the
       * softened canopy; each mass is shaded from its foot to its tallest point nearby. */
      function todaysCanopy(tile, soft, roof, bounce) {
        const leafy = (i) => soft[i] > 0;
        const own = [];
        const rest = [];
        for (let r = 0; r + 1 < rows; r++) {
          for (let c = 0; c + 1 < cols; c++) {
            const a = r * cols + c;
            const b = a + cols;
            for (const tri of [
              [a, b, a + 1],
              [b, b + 1, a + 1],
            ]) {
              (tri.some(leafy) ? own : rest).push(...tri);
            }
          }
        }
        tile.setIndex(rest);

        const reachCells = Math.round(MASS_M / px);
        const grey = lin3(ROOF);
        const rand = mulberry32(7);
        const colour = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          let rgb = GREENS_LIN[0]; // where the foliage meets the ground
          if (roof[i]) rgb = grey;
          else if (leafy(i)) {
            const [r, c] = [Math.floor(i / cols), i % cols];
            const [r0, r1] = [Math.max(0, r - reachCells), Math.min(rows - 1, r + reachCells)];
            const [c0, c1] = [Math.max(0, c - reachCells), Math.min(cols - 1, c + reachCells)];
            let top = 0;
            for (let rr = r0; rr <= r1; rr++) {
              for (let cc = c0; cc <= c1; cc++) top = Math.max(top, soft[rr * cols + cc]);
            }
            const speckle = 0.9 + 0.16 * rand();
            rgb = green(soft[i] / top, CANOPY_STOPS).map((v) => v * speckle);
          }
          colour.set(rgb, i * 3);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", tile.getAttribute("position"));
        geometry.setAttribute("color", new THREE.BufferAttribute(colour, 3));
        geometry.setIndex(own);
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(
          geometry,
          new THREE.MeshLambertMaterial({ vertexColors: true, emissive: bounce }),
        );
        mesh.frustumCulled = false;
        return mesh;
      }

      async function buildFuture() {
        const { dsm, dem, cdsm, zones, base, roof, mesh, pos, col } = await terrain();
        const stages = KV.future.stages;
        const maps = await Promise.all(stages.map((s) => overPaper(s.map)));
        const target = yardCentre(zones, dem, base);

        // Heights once: roofs and today's canopy, softened so the 1 m raster shows as crowns
        // rather than stairs. The new trees are meshes of their own.
        const soft = soften(cdsm, roof, SOFTEN);
        const p = pos.array;
        for (let i = 0; i < n; i++) {
          p[i * 3 + 1] = Math.max(dsm[i] - base, dem[i] - base + soft[i]);
        }
        pos.needsUpdate = true;
        const edge = skirt(p, -SKIRT_M);
        const bounce = new THREE.Color().setRGB(...GREENS_LIN[0].map((v) => v * BOUNCE));
        const canopy = todaysCanopy(mesh.geometry, soft, roof, bounce);

        const grey = lin3(ROOF);
        let painted = "";
        /** Ground from stage a's map, faded by w toward stage b's: nothing but SOLWEIG colour. */
        function paint(a, b, w) {
          if (painted === `${a} ${b} ${w}`) return;
          painted = `${a} ${b} ${w}`;
          const [ma, mb] = [maps[a], maps[b]];
          const c = col.array;
          for (let i = 0; i < n; i++) {
            for (let k = 0; k < 3; k++) {
              const j = i * 3 + k;
              c[j] = roof[i] ? grey[k] : ma[j] + w * (mb[j] - ma[j]);
            }
          }
          col.needsUpdate = true;
        }

        const rand = mulberry32(25);
        const trees = KV.trees.map((t) => {
          const r = Math.floor((y0 - t.y) / px);
          const c = Math.floor((t.x - x0) / px);
          return {
            x: worldX(t.x),
            z: worldZ(t.y),
            ground: dem[r * cols + c] - base,
            yaw: 2 * Math.PI * rand(),
            shape: Math.floor(rand() * SHAPES),
            tint: 0.9 + 0.16 * rand(),
          };
        });
        const leaves = new THREE.MeshLambertMaterial({ vertexColors: true, emissive: bounce });
        const crowns = Array.from({ length: SHAPES }, (_, s) => {
          const mine = trees.filter((t) => t.shape === s);
          const m = new THREE.InstancedMesh(crownGeometry(101 + s), leaves, mine.length);
          mine.forEach((t, k) => m.setColorAt(k, new THREE.Color(t.tint, t.tint, t.tint)));
          m.frustumCulled = false;
          return { mesh: m, trees: mine };
        });
        const stem = new THREE.CylinderGeometry(0.7, 1, 1, 12, 1, true).translate(0, 0.5, 0);
        const trunks = new THREE.InstancedMesh(
          stem,
          new THREE.MeshLambertMaterial({ color: BARK }),
          trees.length,
        );
        trunks.frustumCulled = false;

        const UP = new THREE.Vector3(0, 1, 0);
        const m4 = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const at = new THREE.Vector3();
        const size = new THREE.Vector3();
        /** Every new tree at one size, its crown from SOLWEIG's trunk zone to its top. */
        function grow(h, radius) {
          const on = h > 0;
          trunks.visible = on;
          for (const c of crowns) c.mesh.visible = on;
          if (!on) return;
          const lift = TRUNK * h;
          const depth = h - lift;
          const bole = BOLE * h ** 1.5;
          for (const c of crowns) {
            c.trees.forEach((t, k) => {
              q.setFromAxisAngle(UP, t.yaw);
              m4.compose(at.set(t.x, t.ground + lift, t.z), q, size.set(radius, depth, radius));
              c.mesh.setMatrixAt(k, m4);
            });
            c.mesh.instanceMatrix.needsUpdate = true;
          }
          q.identity();
          trees.forEach((t, k) => {
            m4.compose(
              at.set(t.x, t.ground - SINK, t.z),
              q,
              size.set(bole, SINK + lift + 0.4 * depth, bole),
            );
            trunks.setMatrixAt(k, m4);
          });
          trunks.instanceMatrix.needsUpdate = true;
        }

        // Frame the school with the grown planting standing in it: every school cell at its
        // ground and its top, and each tree's crown at the last stage as a cylinder.
        const last = stages[stages.length - 1];
        const school = [];
        for (let i = 0; i < n; i++) {
          if (zones[i] !== ZONE_GROUND && zones[i] !== ZONE_BUILDING) continue;
          const x = p[i * 3];
          const z = p[i * 3 + 2];
          school.push(x, dem[i] - base, z, x, p[i * 3 + 1], z);
        }
        const grove = [];
        for (const t of trees) {
          for (let k = 0; k < 16; k++) {
            const a = (2 * Math.PI * k) / 16;
            const [x, z] = [t.x + last.radius * Math.cos(a), t.z + last.radius * Math.sin(a)];
            grove.push(x, t.ground + TRUNK * last.height, z, x, t.ground + last.height, z);
          }
        }
        const all = Float32Array.from([...school, ...grove]);
        const views = {
          still: frameView(all, target, STILL),
          from: frameView(all, target, RIDE.from),
          to: frameView(all, target, RIDE.to),
        };

        const scene = new THREE.Scene();
        scene.add(mesh, canopy, edge, trunks, ...crowns.map((c) => c.mesh));
        addLights(scene);
        const camera = new THREE.PerspectiveCamera(FOV, width / height, 10, 10000);
        const renderer = makeRenderer();

        /** The ride's camera at progress c: angles straight, distance in proportion. */
        function ride(c) {
          const { from, to } = views;
          const mix = (a, b) => a + c * (b - a);
          return {
            elevation: mix(from.elevation, to.elevation),
            bearing: mix(from.bearing, to.bearing),
            distance: Math.exp(mix(Math.log(from.distance), Math.log(to.distance))),
            sx: mix(from.sx, to.sx),
            sy: mix(from.sy, to.sy),
          };
        }

        window.drawFuture = ({ height: h, radius, ground, view }) => {
          paint(...ground);
          grow(h, radius);
          const v = view === "still" ? views.still : ride(view);
          aim(camera, v.elevation, v.bearing, v.distance, target);
          const [dx, dy] = [(v.sx * width) / 2, (-v.sy * height) / 2];
          camera.setViewOffset(width, height, dx, dy, width, height);
          renderer.render(scene, camera);
        };

        return { gl: glName(renderer), trees: trees.length, views };
      }

      /** The distance at which the points fill one fixed view, less a margin, and the lens
       * shift that centres them. room > 1 stands the camera further back. */
      function frameView(points, target, { elevation, bearing, margin, room = 1 }) {
        const camera = new THREE.PerspectiveCamera(FOV, width / height, 1, 10000);
        const v = new THREE.Vector3();
        const extent = (distance) => {
          aim(camera, elevation, bearing, distance, target);
          let [xl, xh, yl, yh] = [Infinity, -Infinity, Infinity, -Infinity];
          for (let k = 0; k < points.length; k += 3) {
            v.set(points[k], points[k + 1], points[k + 2]).project(camera);
            xl = Math.min(xl, v.x);
            xh = Math.max(xh, v.x);
            yl = Math.min(yl, v.y);
            yh = Math.max(yh, v.y);
          }
          return { xl, xh, yl, yh };
        };
        let near = 50;
        let far = 5000;
        for (let it = 0; it < 30; it++) {
          const mid = (near + far) / 2;
          const e = extent(mid);
          if ((e.xh - e.xl) / 2 <= 1 - margin && (e.yh - e.yl) / 2 <= 1 - margin) far = mid;
          else near = mid;
        }
        const distance = far * room;
        const e = extent(distance);
        return { elevation, bearing, distance, sx: (e.xh + e.xl) / 2, sy: (e.yh + e.yl) / 2 };
      }

      window.ready = KV.future ? buildFuture() : build();
    </script>
  </body>
</html>
