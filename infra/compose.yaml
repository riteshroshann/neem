# Local stack with AWS parity (ADR 0004): moto stands in for DynamoDB and SQS; the api and
# worker containers are the images that deploy to Lambda.
name: neem

x-aws: &aws
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  NEEM_AWS_ENDPOINT_URL: http://moto:5000
  NEEM_AWS_REGION: ap-south-1
  NEEM_JOBS: aws
  NEEM_JOBS_TABLE: neem-jobs
  NEEM_JOBS_QUEUE_URL: http://moto:5000/000000000000/neem-jobs

services:
  moto:
    image: motoserver/moto:5.1.4
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 5s
      retries: 20

  bootstrap:
    image: neem:local
    build: { context: .., dockerfile: infra/Dockerfile }
    depends_on: { moto: { condition: service_healthy } }
    environment: *aws
    command: ["python", "-m", "neem_worker.bootstrap"]
    restart: "no"

  api:
    image: neem:local
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    environment:
      <<: *aws
      NEEM_CORS_ORIGINS: '["http://localhost:4321","http://127.0.0.1:4321"]'
    volumes: ["../data/lake:/lake"]
    ports: ["8000:8000"]

  worker:
    image: neem:local
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    environment: *aws
    volumes: ["../data/lake:/lake"]
    command: ["neem-worker"]
    deploy: { replicas: 2 }
