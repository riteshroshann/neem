[project]
name = "neem-core"
version = "0.1.0"
description = "Neem physics core: scenes, interventions, SOLWEIG engine, fast surrogate, child body twin, optimiser"
authors = [{ name = "Ritesh Roshan", email = "riteshroshansahoo01@gmail.com" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.2.6",
    "pydantic>=2.14.0",
    "pymoo>=0.6.2",
    "pythermalcomfort>=4.6.1",
    "solweig>=0.1.0b96",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
