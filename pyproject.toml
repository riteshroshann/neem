[project]
name = "neem"
version = "0.1.0"
description = "Physics-grade heat twin for Delhi schoolyards"
authors = [{ name = "Ritesh Roshan", email = "riteshroshansahoo01@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = ["neem-core", "neem-data", "neem-api", "neem-worker", "neem-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
neem-core = { workspace = true }
neem-data = { workspace = true }
neem-api = { workspace = true }
neem-worker = { workspace = true }
neem-agent = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "hypothesis>=6.168.5",
    "moto[dynamodb,sqs]>=5.2.3",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "web", "recon/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
# N803/N806: physics code keeps conventional symbols (Ta, Tmrt, H).
ignore = ["N803", "N806"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["packages"]
exclude = ["**/.venv", "data", "web", "recon"]
reportMissingTypeStubs = false
extraPaths = ["packages/neem-core/tests"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["packages/neem-core/tests"]
markers = [
  "slow: runs the full SOLWEIG engine",
  "integration: needs the local AWS stack (just up)",
  "network: reads public datasets over the internet",
]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]

[tool.ruff.lint.isort]
known-first-party = ["neem_core", "neem_data", "neem_api", "neem_worker", "neem_agent"]
